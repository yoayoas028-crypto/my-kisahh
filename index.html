<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Galeri Foto Saya</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #111;
            color: white;
        }
        h1 {
            margin-top: 20px;
        }
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .gallery img {
            width: 250px;
            border-radius: 15px;
            box-shadow: 0 0 15px pink;
            transition: 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Galeri Foto Saya</h1>

    <div class="gallery">
        <img src="foto 1.jpg" alt="Foto1">
        <img src="foto 2.jpg" alt="Foto2">
    </div>

</body>
</html>l>
