<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Girl 💗</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #ffe4ec, #ffd6e7);
    text-align: center;
    overflow-x: hidden;
}

/* JUDUL */
h1 {
    margin-top: 20px;
    font-size: 40px;
    color: #ff4d88;
    opacity: 0;
    transform: translateY(-20px);
    animation: fadeDown 1s ease forwards;
}

/* SLIDER */
.slider-container {
    position: relative;
    width: 90%;
    margin: auto;
    overflow: hidden;
}

.slider {
    display: flex;
    transition: transform 0.5s ease-in-out;
    touch-action: pan-y;
}

/* SLIDE */
.slide {
    min-width: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* FOTO */
.photo {
    background: white;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(255,105,180,0.2);

    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 0.8s ease forwards;
}

.photo img {
    width: 100%;
    border-radius: 15px;
}

/* DELAY FOTO */
.photo:nth-child(1){animation-delay:0.2s;}
.photo:nth-child(2){animation-delay:0.4s;}

/* BUTTON */
button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #ff66a3;
    border: none;
    color: white;
    font-size: 20px;
    padding: 10px;
    cursor: pointer;
    border-radius: 50%;
}

.prev { left: 10px; }
.next { right: 10px; }

/* FOOTER */
.footer {
    margin: 20px;
    color: #ff66a3;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 1.5s;
}

/* ANIMASI */
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
    to { opacity: 1; transform: translateY(0); }
}

/* EMOJI */
.emoji {
    position: fixed;
    font-size: 25px;
    opacity: 0.4;
    animation: float 10s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 0.5; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>💗 My Girl 💗</h1>

<div class="slider-container">
    <button class="prev" onclick="prevSlide()">❮</button>

    <div class="slider" id="slider">

        <div class="slide">
            <div class="photo"><img src="foto1.jpg"></div>
            <div class="photo"><img src="foto2.jpg"></div>
        </div>

        <div class="slide">
            <div class="photo"><img src="foto3.jpg"></div>
            <div class="photo"><img src="foto4.jpg"></div>
        </div>

        <div class="slide">
            <div class="photo"><img src="foto5.jpg"></div>
            <div class="photo"><img src="foto6.jpg"></div>
        </div>

        <div class="slide">
            <div class="photo"><img src="foto7.jpg"></div>
            <div class="photo"><img src="foto8.jpg"></div>
        </div>

        <div class="slide">
            <div class="photo"><img src="foto9.jpg"></div>
            <div class="photo"><img src="foto10.jpg"></div>
        </div>

    </div>

    <button class="next" onclick="nextSlide()">❯</button>
</div>

<div class="footer">Made with love 💗</div>

<script>
let index = 0;
const slider = document.getElementById("slider");
const totalSlides = document.querySelectorAll(".slide").length;

function showSlide() {
    slider.style.transform = `translateX(-${index * 100}%)`;
}

function nextSlide() {
    index = (index + 1) % totalSlides;
    showSlide();
}

function prevSlide() {
    index = (index - 1 + totalSlides) % totalSlides;
    showSlide();
}

/* AUTO SLIDE */
let autoSlide = setInterval(nextSlide, 3000);

/* SWIPE */
let startX = 0;
let endX = 0;

slider.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    clearInterval(autoSlide);
});

slider.addEventListener("touchmove", (e) => {
    endX = e.touches[0].clientX;
});

slider.addEventListener("touchend", () => {
    let diff = startX - endX;

    if (diff > 50) nextSlide();
    else if (diff < -50) prevSlide();

    startX = 0;
    endX = 0;
});

/* EMOJI */
const emojis = ["🌸","💞","💐"];

function createEmoji() {
    const emoji = document.createElement("div");
    emoji.classList.add("emoji");
    emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

    emoji.style.left = Math.random() * 100 + "vw";
    emoji.style.fontSize = (20 + Math.random() * 20) + "px";
    emoji.style.animationDuration = (5 + Math.random() * 5) + "s";

    document.body.appendChild(emoji);

    setTimeout(() => emoji.remove(), 10000);
}

setInterval(createEmoji, 500);
</script>

</body>
</html>
